
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'az.iktex.organization.structure'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

configurations {
    liquibaseCli
}

dependencies {
    liquibaseCli 'info.picocli:picocli:4.7.7'
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Liquibase
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'

    // Hibernate Second-Level Cache
    implementation 'org.hibernate.orm:hibernate-jcache'
    implementation 'org.ehcache:ehcache:3.10.8:jakarta'

    // MapStruct
    implementation 'org.mapstruct:mapstruct:1.6.3'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Annotation processors
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'

    // Development
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()

    testLogging {
        events "passed", "failed", "skipped"
        showStandardStreams = true
    }
}

// Uses the same Liquibase and PostgreSQL versions as the application.
def migrationCommands = [
    liquibaseHelp: ['--help'],
    liquibaseStatus: ['status', '--verbose'],
    liquibaseValidate: ['validate'],
    liquibaseUpdate: ['update', '--context-filter=dev'],
    liquibaseRollbackSql: ['rollback-sql'],
    liquibaseRollback: ['rollback']
]
migrationCommands.each { taskName, commandArgs ->
    tasks.register(taskName, JavaExec) {
        group = 'Liquibase'
        description = "Run Liquibase ${commandArgs.first()} against the configured database"
        classpath = sourceSets.main.runtimeClasspath + configurations.liquibaseCli
        mainClass = 'liquibase.integration.commandline.LiquibaseCommandLine'
        systemProperty 'user.language', 'en'
        systemProperty 'user.country', 'US'
        environment 'LIQUIBASE_COMMAND_PASSWORD', System.getenv('LIQUIBASE_COMMAND_PASSWORD') ?: 'postgres'
        args '--search-path=src/main/resources',
             '--changelog-file=db/changelog/db.changelog-master.yaml',
             "--url=${System.getenv('LIQUIBASE_COMMAND_URL') ?: 'jdbc:postgresql://localhost:5432/school_liquibase_db'}",
             "--username=${System.getenv('LIQUIBASE_COMMAND_USERNAME') ?: 'postgres'}"
        args commandArgs
        if (taskName in ['liquibaseRollbackSql', 'liquibaseRollback']) {
            args "--tag=${providers.gradleProperty('rollbackTag').getOrElse('v1.0')}"
        }
        if (providers.gradleProperty('liquibaseHelp').isPresent()) {
            args '--help'
        }
    }
}
